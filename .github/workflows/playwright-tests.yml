name: Playwright Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Framework Repository
      uses: actions/checkout@v4

    - name: Checkout ByteMart App SUT
      uses: actions/checkout@v4
      with:
        repository: nikhithamn/bytemart-app
        path: sut-app

    - name: Start ByteMart SUT Application Services
      run: |
        cd sut-app
        docker compose up -d --build
        echo "Waiting for ByteMart backend & DB services to be healthy..."
        timeout 60s bash -c 'until curl -s http://localhost:5001/api/products > /dev/null; do sleep 2; done' || true
        echo "Seeding ByteMart database with test accounts & products..."
        docker exec qa-backend-api npm run db:seed || docker exec qa-backend-api npx prisma db seed || true
        echo "ByteMart SUT is ready!"

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      run: npm run test

    - name: Upload Playwright Test Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
